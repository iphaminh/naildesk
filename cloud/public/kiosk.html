<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Dream Nails &amp; Spa · Check In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root { --gold:#c9a87c; --dark:#111111; --cream:#faf6f0; --ink:#2b2620; --muted:#8a7f70; --line:#e9dfd2; }
body { font-family:'Jost',sans-serif; background:var(--dark); color:#fff; min-height:100vh; display:flex; flex-direction:column; align-items:center; }
h1 { font-family:'Cormorant Garamond',serif; font-weight:600; font-size:1.9rem; letter-spacing:.05em; margin-top:30px; }
.tag { color:var(--gold); font-size:.75rem; letter-spacing:.3em; text-transform:uppercase; margin:6px 0 20px; }
.card { background:#1b1712; border:1px solid #3a3226; border-radius:20px; padding:24px; width:min(94vw,430px); text-align:center; margin-bottom:30px; }
.phone { font-size:2rem; letter-spacing:.08em; min-height:52px; color:var(--gold); font-weight:500; }
.phone .ph { color:#5a5245; }
.pad { display:grid; grid-template-columns:repeat(3,1fr); gap:11px; margin-top:16px; }
.pad button { font:inherit; font-size:1.7rem; padding:17px 0; border-radius:14px; border:1px solid #3a3226; background:#241f18; color:#fff; cursor:pointer; }
.pad button:active { background:var(--gold); color:var(--dark); }
.go { grid-column:span 3; background:var(--gold) !important; color:var(--dark) !important; font-size:1.15rem !important; letter-spacing:.12em; text-transform:uppercase; font-weight:600; }
.go:disabled { opacity:.4; }
.msg { min-height:22px; color:#e0a3a3; font-size:.9rem; margin-top:10px; }
.result h2 { font-family:'Cormorant Garamond',serif; font-size:1.7rem; margin-bottom:6px; }
.big { font-size:3.4rem; margin:6px 0; }
.pts { font-size:2.6rem; color:var(--gold); font-weight:600; }
.sub { color:#b8ad9c; font-size:.95rem; line-height:1.6; margin-top:8px; }
.bar { height:12px; background:#241f18; border-radius:99px; margin:16px 0 6px; overflow:hidden; }
.bar i { display:block; height:100%; background:var(--gold); border-radius:99px; transition:width .6s; }
input.txt { width:100%; font:inherit; font-size:1.1rem; padding:13px; border-radius:12px; border:1px solid #3a3226; background:#241f18; color:#fff; text-align:center; margin-top:10px; }
input.txt:focus { outline:2px solid var(--gold); }
.btn2 { font:inherit; width:100%; font-size:1.05rem; letter-spacing:.1em; text-transform:uppercase; background:var(--gold); color:var(--dark); border:0; border-radius:12px; padding:14px; margin-top:14px; cursor:pointer; font-weight:600; }
.linkish { background:none; border:none; color:#8a7f70; font:inherit; margin-top:14px; cursor:pointer; text-decoration:underline; }
.hidden { display:none; }
footer { color:#5a5245; font-size:.75rem; margin-bottom:18px; }
</style>
</head>
<body>
<h1>Dream Nails &amp; Spa</h1>
<div class="tag">Member Check In</div>

<div class="card" id="stepPhone">
  <p style="color:#b8ad9c">Enter your phone number to earn today's points</p>
  <div class="phone" id="disp"><span class="ph">(___) ___-____</span></div>
  <div class="pad">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button data-k="back">⌫</button><button data-k="0">0</button><button data-k="clear">C</button>
    <button class="go" id="goBtn" disabled>Check In</button>
  </div>
  <div class="msg" id="msg"></div>
</div>

<div class="card hidden" id="stepNew">
  <h2 style="font-family:'Cormorant Garamond',serif;font-size:1.5rem">Welcome! First time here?</h2>
  <p class="sub">Tell us your name to join our rewards. Add your birthday and we treat you in your birthday month.</p>
  <input class="txt" id="newName" placeholder="Your first name">
  <input class="txt" id="newBday" placeholder="Birthday MM/DD (optional)" maxlength="5">
  <input class="txt" id="newRef" type="tel" placeholder="Friend who sent you? Their phone (optional)" maxlength="14">
  <button class="btn2" id="joinBtn">Join and check in</button>
  <button class="linkish" onclick="reset()">Start over</button>
  <div class="msg" id="msg2"></div>
</div>

<div class="card result hidden" id="stepDone">
  <div class="big" id="doneEmoji">💅</div>
  <h2 id="doneTitle"></h2>
  <div class="pts" id="donePts"></div>
  <div class="bar"><i id="doneBar" style="width:0%"></i></div>
  <div class="sub" id="doneSub"></div>
</div>

<footer>Earn points every visit · 100 points is $5 off</footer>

<script>
const $ = id => document.getElementById(id);
let digits = '';

function fmt() {
  const d = digits;
  let out = '';
  if (d.length > 0) out = '(' + d.slice(0, 3);
  if (d.length >= 4) out += ') ' + d.slice(3, 6);
  if (d.length >= 7) out += '-' + d.slice(6, 10);
  $('disp').innerHTML = out || '<span class="ph">(___) ___-____</span>';
  $('goBtn').disabled = d.length !== 10;
}

document.querySelectorAll('.pad button[data-k]').forEach(b => b.onclick = () => {
  const k = b.dataset.k;
  if (k === 'back') digits = digits.slice(0, -1);
  else if (k === 'clear') digits = '';
  else if (digits.length < 10) digits += k;
  fmt();
});

async function checkin(extra) {
  const body = { mobile: digits, ...(extra || {}) };
  const r = await fetch('/api/public/checkin', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
  });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || 'Try again please');
  return d;
}

function showDone(d) {
  $('stepPhone').classList.add('hidden');
  $('stepNew').classList.add('hidden');
  $('stepDone').classList.remove('hidden');
  const name = d.first_name ? d.first_name.split(' ')[0] : 'there';
  if (d.alreadyToday) {
    $('doneEmoji').textContent = '🌸';
    $('doneTitle').textContent = `Welcome back, ${name}!`;
    $('donePts').textContent = `${Math.round(d.balance)} points`;
    $('doneSub').textContent = 'You already checked in today. See you at the chair!';
  } else {
    $('doneEmoji').textContent = d.birthdayBonus ? '🎂' : '✨';
    $('doneTitle').textContent = d.isNew ? `Welcome, ${name}!` : `Hi ${name}, points added!`;
    $('donePts').textContent = `+${d.awarded} points  ·  ${Math.round(d.balance)} total`;
    const refNote = d.referredBy ? ` Thanks for coming in — we told ${d.referredBy}'s rewards too, points land after your first visit!` : '';
    $('doneSub').textContent = (d.birthdayBonus
      ? `Happy birthday month! We added a ${d.birthdayBonus} point gift. ${progressText(d)}`
      : progressText(d)) + refNote;
  }
  const pct = Math.min(100, Math.round((d.balance % 100)));
  $('doneBar').style.width = (d.balance >= 100 ? 100 : pct) + '%';
  setTimeout(reset, 9000);
}

function progressText(d) {
  if (d.balance >= 100) {
    const dollars = (Math.floor(d.balance / 100) * 100 * d.point_value).toFixed(0);
    return `You have a reward ready: $${dollars} off. Tell the front desk to use it!`;
  }
  return `${100 - Math.round(d.balance % 100)} points to your next $5 off.`;
}

$('goBtn').onclick = async () => {
  $('msg').textContent = '';
  $('goBtn').disabled = true;
  try {
    const d = await checkin();
    if (d.notFound) {
      $('stepPhone').classList.add('hidden');
      $('stepNew').classList.remove('hidden');
      $('newName').focus();
    } else showDone(d);
  } catch (e) { $('msg').textContent = e.message; }
  $('goBtn').disabled = false;
};

$('joinBtn').onclick = async () => {
  const name = $('newName').value.trim();
  if (!name) { $('msg2').textContent = 'Please enter your name'; return; }
  $('msg2').textContent = '';
  try {
    const d = await checkin({ first_name: name, birthday: $('newBday').value.trim(), referral_phone: $('newRef').value.trim() });
    showDone(d);
  } catch (e) { $('msg2').textContent = e.message; }
};

function reset() {
  digits = '';
  fmt();
  $('newName').value = ''; $('newBday').value = ''; $('newRef').value = '';
  $('msg').textContent = ''; $('msg2').textContent = '';
  $('stepDone').classList.add('hidden');
  $('stepNew').classList.add('hidden');
  $('stepPhone').classList.remove('hidden');
}
fmt();
</script>
</body>
</html>
